name: OroTitan Bridge LOAD Veolia

on:
  workflow_dispatch:
    inputs:
      preview_origin:
        description: Protected READY preview origin for orotitan-vnext-pilotage (scheme + host only)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  load-veolia:
    runs-on: ubuntu-latest
    steps:
      - name: Validate protected preview origin
        id: target
        env:
          PREVIEW_ORIGIN: ${{ inputs.preview_origin }}
        run: |
          set -euo pipefail

          node - <<'NODE'
          const fs = require('fs');

          const raw = process.env.PREVIEW_ORIGIN ?? '';
          const url = new URL(raw);
          const allowedHost = /^orotitan-vnext-pilotage-[a-z0-9-]+-orotitan\.vercel\.app$/;

          if (
            url.protocol !== 'https:' ||
            url.username !== '' ||
            url.password !== '' ||
            url.port !== '' ||
            url.pathname !== '/' ||
            url.search !== '' ||
            url.hash !== '' ||
            !allowedHost.test(url.hostname)
          ) {
            throw new Error('OROTITAN_LOAD_PREVIEW_ORIGIN_REJECTED');
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `origin=${url.origin}\n`,
          );
          NODE

      - name: Mint GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Print selected OIDC claims
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail

          node - <<'NODE'
          const token = process.env.OIDC_TOKEN ?? '';
          const parts = token.split('.');

          if (parts.length !== 3) {
            throw new Error('OROTITAN_OIDC_TOKEN_INVALID');
          }

          const payload = JSON.parse(
            Buffer.from(parts[1], 'base64url').toString('utf8'),
          );

          const safe = {
            iss: payload.iss ?? null,
            aud: payload.aud ?? null,
            repository: payload.repository ?? null,
            ref: payload.ref ?? null,
            workflow: payload.workflow ?? null,
            workflow_ref: payload.workflow_ref ?? null,
            event_name: payload.event_name ?? null,
          };

          console.log(JSON.stringify(safe, null, 2));
          NODE
