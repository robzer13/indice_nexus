name: ASML primary source capture SHADOW v2.9 — isolated CI
on:
  push:
    branches:
      - feat/asml-primary-source-capture-shadow-v29-20261030
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9 # v4.2.2
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned direct dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript (full repo)
        run: npm run typecheck
      - name: ESLint (full repo)
        run: npm run lint
      - name: Capture security regression suite (synthetic fixtures only)
        run: node --experimental-strip-types --test tests/asml-official-pdf-capture-v29.test.mjs
      - name: All unit tests
        run: npm test
