name: OroTitan public source byte capture - unadmitted

on:
  pull_request:
    paths:
      - '.github/workflows/orotitan-public-source-capture.yml'
      - 'scripts/orotitan-equity/public-source-capture.mjs'
      - 'tests/public-source-capture.test.mjs'
  workflow_dispatch:
    inputs:
      source_url:
        description: 'Public SEC issuer archive HTML, issuer ASML HTML or issuer-hosted PDF; NO private URLs'
        required: true
        type: string
      source_publication_date:
        description: 'Declared date YYYY-MM-DD; not independently verified'
        required: false
        type: string

permissions:
  contents: read

jobs:
  public-source-byte-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline integrity and SSRF tests
        run: node --test tests/public-source-capture.test.mjs
      - name: Capture a public issuer page without Registry admission
        id: capture
        continue-on-error: true
        env:
          SOURCE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.source_url || 'https://ourbrand.asml.com/m/71076aaad607de4d/original/asml-2025-annual-report-based-on-us-gaap.pdf' }}
          SOURCE_PUBLICATION_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.source_publication_date || '' }}
          SOURCE_CAPTURE_DIR: captured-public-source
          DATA_CUTOFF: '2026-09-21'
          SEC_EDGAR_CONTACT: ${{ github.event_name == 'workflow_dispatch' && secrets.SEC_EDGAR_CONTACT || '' }}
        run: node scripts/orotitan-equity/public-source-capture.mjs
      - name: Record evidence transport outcome
        if: always()
        run: |
          echo "Source capture status: ${{ steps.capture.outcome }}"
          echo "### Unattested public source capture" >> "$GITHUB_STEP_SUMMARY"
          echo "Transport: ${{ steps.capture.outcome }}. Original-byte receipt if and only if the artifact upload step succeeds." >> "$GITHUB_STEP_SUMMARY"
          echo "No source admission, historical cutoff identity, Registry mutation or certification is performed." >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.capture.outcome }}" != "success" ]; then
            echo "::warning::Public source byte capture FAILED; do not interpret the green offline-test job as evidence admission."
          fi
      - name: Upload public issuer source bytes and unadmitted receipt
        if: steps.capture.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: public-original-bytes-unattested-${{ github.run_id }}
          path: captured-public-source/
          if-no-files-found: error
          retention-days: 7
