name: Gate 18 Provider Calibration

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Gate 18 operation
        required: true
        type: choice
        options:
          - provider-preflight
          - model-smoke

permissions:
  contents: read
  id-token: write

jobs:
  provider-preflight:
    if: inputs.operation == 'provider-preflight'
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Inspect provider credential presence safely
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          PREFLIGHT_URL: https://orotitan-vnext-pilotage-git-gate18-real-model-c-f36b8f-orotitan.vercel.app/api/vnext/calibration/provider-preflight
        run: |
          set -euo pipefail

          status="$(curl -sS             -o gate18-provider-preflight.json             -w '%{http_code}'             -H "x-vercel-trusted-oidc-idp-token: $OIDC_TOKEN"             "$PREFLIGHT_URL")"

          echo "HTTP_STATUS=$status"

          if [ "$status" != "200" ]; then
            cat gate18-provider-preflight.json || true
            exit 1
          fi

          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(
            fs.readFileSync('gate18-provider-preflight.json', 'utf8')
          );

          if (
            payload.gate !== 18 ||
            payload.status !== 'PROVIDER_PREFLIGHT' ||
            payload.previewOnly !== true
          ) {
            throw new Error('GATE18_PROVIDER_PREFLIGHT_INVALID');
          }

          console.log(JSON.stringify(payload, null, 2));
          NODE

  model-smoke:
    if: inputs.operation == 'model-smoke'
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Invoke protected Vercel preview smoke
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          SMOKE_URL: https://orotitan-vnext-pilotage-git-gate18-real-model-c-f36b8f-orotitan.vercel.app/api/vnext/calibration/gate18-smoke?run=gate18-smoke-v0-1
        run: |
          set -euo pipefail

          status="$(curl -sS             -o gate18-smoke.json             -w '%{http_code}'             -H "x-vercel-trusted-oidc-idp-token: $OIDC_TOKEN"             "$SMOKE_URL")"

          echo "HTTP_STATUS=$status"

          if [ "$status" != "200" ]; then
            cat gate18-smoke.json || true
            exit 1
          fi

          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(
            fs.readFileSync('gate18-smoke.json', 'utf8')
          );

          if (
            payload.gate !== 18 ||
            payload.status !== 'SMOKE_PASS' ||
            payload.calibrationOnly !== true ||
            payload.publicationAuthority !== false ||
            payload.modelWinnerSelected !== false ||
            !Array.isArray(payload.receipts) ||
            payload.receipts.length !== 4
          ) {
            throw new Error('GATE18_SMOKE_RESPONSE_INVALID');
          }

          const expected = new Set([
            'LUNA',
            'TERRA',
            'SOL',
            'ASTRA',
          ]);

          for (const receipt of payload.receipts) {
            if (!expected.delete(receipt.label)) {
              throw new Error('GATE18_SMOKE_MODEL_SET_INVALID');
            }

            if (receipt.schemaValid !== true) {
              throw new Error('GATE18_SMOKE_SCHEMA_INVALID');
            }
          }

          if (expected.size !== 0) {
            throw new Error('GATE18_SMOKE_MODEL_MISSING');
          }

          const safe = {
            gate: payload.gate,
            status: payload.status,
            calibrationOnly: payload.calibrationOnly,
            publicationAuthority: payload.publicationAuthority,
            modelWinnerSelected: payload.modelWinnerSelected,
            receipts: payload.receipts.map((receipt) => ({
              label: receipt.label,
              modelId: receipt.modelId,
              intendedTier: receipt.intendedTier,
              requestedReasoning: receipt.requestedReasoning,
              schemaValid: receipt.schemaValid,
              latencyMs: receipt.latencyMs,
              inputTokens: receipt.inputTokens,
              outputTokens: receipt.outputTokens,
              reasoningTokens: receipt.reasoningTokens,
              totalTokens: receipt.totalTokens,
              finishReason: receipt.finishReason,
            })),
          };

          console.log(JSON.stringify(safe, null, 2));
          NODE
