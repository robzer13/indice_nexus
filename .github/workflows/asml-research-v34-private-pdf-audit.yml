name: ASML Research v3.4 — SHADOW PDF independent re-audit

on:
  push:
    branches:
      - feat/asml-research-v34-private-pdf-reaudit-20261031
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Exact branch checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Full unit suite including synthetic PDF parser and SHA regressions
        run: npm test
      - name: Next.js production build
        run: npm run build
