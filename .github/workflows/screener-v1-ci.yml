name: Screener CI

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'tests/*.test.ts'
      - 'tests/postgres/**'
      - 'migrations/**'
      - '.env.example'
      - 'package.json'
      - 'tsconfig.json'
      - 'next-env.d.ts'
      - 'next.config.js'
      - 'postcss.config.js'
      - 'tailwind.config.js'
      - 'eslint.config.mjs'
      - 'vercel.json'
      - 'schema.sql'
      - 'seed.sql'
      - 'README_SCREENER_V1*.md'
      - '.github/workflows/screener-v1-ci.yml'
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'tests/*.test.ts'
      - 'tests/postgres/**'
      - 'migrations/**'
      - '.env.example'
      - 'package.json'
      - 'tsconfig.json'
      - 'next-env.d.ts'
      - 'next.config.js'
      - 'postcss.config.js'
      - 'tailwind.config.js'
      - 'eslint.config.mjs'
      - 'vercel.json'
      - 'schema.sql'
      - 'seed.sql'
      - 'README_SCREENER_V1*.md'
      - '.github/workflows/screener-v1-ci.yml'

jobs:
  verify-screener:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: PostgreSQL migration tests
        run: npm run test:postgres
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: V3 Registry admission regression
        run: bash tests/postgres/run-v3-contract-admission-tests.sh
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
      - name: Production build
        run: npm run build
