name: Generate Registry Forward Migration

on:
  push:
    branches:
      - fix/orotitan-registry-bundle-persistence-integrity
    paths:
      - '.github/workflows/generate-registry-forward-migration.yml'

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/orotitan-registry-bundle-persistence-integrity
          fetch-depth: 0
      - name: Generate migration identity with Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          rm -rf supabase/migrations
          mkdir -p supabase/migrations
          npx --yes supabase@latest migration new orotitan_registry_bundle_persistence_integrity
          generated="$(find supabase/migrations -maxdepth 1 -type f -name '*_orotitan_registry_bundle_persistence_integrity.sql' -print -quit)"
          test -n "$generated"
          target="migrations/$(basename "$generated")"
          mv "$generated" "$target"
          rmdir supabase/migrations supabase 2>/dev/null || true
          printf '%s\n' '-- Generated by governed Supabase CLI workflow; implementation follows in subsequent commits.' > "$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "chore(registry): generate forward migration identity"
          git push origin HEAD:fix/orotitan-registry-bundle-persistence-integrity
